[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "savettc"
version = "1.0.0"
description = "SAVE-TTC: start-and-view ensembling of test-time counterattacks for CLIP"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "torchvision>=0.15", "numpy", "scipy", "pillow", "tqdm",
                "ftfy", "regex", "einops", "packaging", "pyyaml"]

[tool.setuptools]
packages = ["savettc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
